<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日のおでかけ">
<meta name="theme-color" content="#1F3B2C">
<title>今日のおでかけ｜自然・温泉・散策スポット検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3B2C; --ink-soft:#3D5A4B; --paper:#EEF0E5; --paper-deep:#E4E7D7;
    --card:#FBFAF3; --mustard:#D9A441; --mustard-deep:#B9822B; --sky:#4C7A96;
    --brick:#8C3B2E; --line: rgba(31,59,42,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(76,122,150,0.08), transparent 55%),
      repeating-radial-gradient(circle at 20% 10%, transparent 0, transparent 38px, var(--line) 39px, transparent 40px),
      var(--paper);
    color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:60px;
  }
  h1,h2,.mincho{font-family:'Shippori Mincho', serif;}
  header.board{
    margin:18px 14px 20px; padding:22px 20px 20px; background:var(--ink); color:var(--paper);
    border-radius:6px; position:relative; box-shadow:0 10px 22px rgba(31,59,42,0.25);
    border:1px solid rgba(255,255,255,0.06);
  }
  header.board::before{
    content:""; position:absolute; left:50%; top:-12px; transform:translateX(-50%);
    width:6px; height:26px; background:#8a7350; border-radius:2px;
  }
  .eyebrow{ font-size:11px; letter-spacing:.24em; color:var(--mustard); text-transform:uppercase; margin-bottom:6px; font-weight:700; }
  header.board h1{ font-size:24px; line-height:1.4; margin:0 0 4px; font-weight:700; }
  header.board .sub{ font-size:12.5px; color:rgba(238,240,229,0.72); margin-bottom:14px; }

  .origin-block{ border-top:1px dashed rgba(238,240,229,0.28); padding-top:14px; }
  .origin-label{ font-size:11px; letter-spacing:.1em; color:var(--mustard); font-weight:700; margin-bottom:6px; }
  .origin-row{ display:flex; gap:6px; }
  .origin-row input{ flex:1; padding:9px 10px; border-radius:5px; border:1px solid rgba(238,240,229,0.35); background:rgba(238,240,229,0.08); color:var(--paper); font-family:inherit; font-size:13.5px; }
  .origin-row input::placeholder{ color:rgba(238,240,229,0.45); }
  .origin-btn{ padding:9px 13px; border-radius:5px; border:none; background:var(--mustard); color:var(--ink); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .origin-sub{ display:flex; gap:14px; margin-top:8px; }
  .origin-link{ background:none; border:none; color:rgba(238,240,229,0.75); font-family:inherit; font-size:11.5px; font-weight:700; padding:0; cursor:pointer; text-decoration:underline; }
  .origin-status{ font-size:11px; color:var(--mustard); margin-top:8px; min-height:14px; }
  .origin-current{ font-size:11.5px; color:rgba(238,240,229,0.8); margin-top:6px; }

  .weather-strip{ display:flex; align-items:center; gap:14px; border-top:1px dashed rgba(238,240,229,0.28); padding-top:14px; margin-top:14px; }
  .w-icon{ font-size:34px; line-height:1; }
  .w-main{ flex:1; }
  .w-temp{ font-size:26px; font-weight:700; font-family:'Shippori Mincho',serif; }
  .w-desc{ font-size:12px; color:rgba(238,240,229,0.75); margin-top:2px; }
  .w-season{ font-size:11px; background:var(--mustard); color:var(--ink); padding:3px 10px; border-radius:100px; font-weight:700; white-space:nowrap; }
  .w-loading{ font-size:13px; color:rgba(238,240,229,0.7); }
  .w-note{ font-size:10.5px; color:rgba(238,240,229,0.55); margin-top:8px; }

  .mode-toggle{ display:flex; gap:6px; margin-top:12px; }
  .mode-btn{ flex:1; padding:7px; border-radius:5px; border:1px solid rgba(238,240,229,0.35); background:transparent; color:rgba(238,240,229,0.8); font-family:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
  .mode-btn.active{ background:var(--mustard); color:var(--ink); border-color:var(--mustard); }
  .manual-panel{ margin-top:12px; display:none; }
  .manual-panel.show{ display:block; }
  .manual-row{ display:flex; gap:8px; margin-bottom:8px; }
  .manual-field{ flex:1; }
  .manual-field label{ font-size:10.5px; color:rgba(238,240,229,0.7); display:block; margin-bottom:4px; }
  .manual-field input, .manual-field select{ width:100%; padding:8px; border-radius:5px; border:1px solid rgba(238,240,229,0.3); background:rgba(238,240,229,0.08); color:var(--paper); font-family:inherit; font-size:13px; }
  .manual-field select option{ color:#111; }

  .filters{ margin:0 14px 18px; }
  .filter-block{ margin-bottom:14px; }
  .filter-label{ font-size:11px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .filter-label::before{ content:"◆"; color:var(--mustard-deep); font-size:9px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ appearance:none; border:1.5px solid var(--ink); background:var(--card); color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:100px; cursor:pointer; transition:transform .12s ease; }
  .chip:active{ transform:scale(0.96); }
  .chip.active{ background:var(--ink); color:var(--paper); }
  .chip.small{ font-size:12px; padding:7px 13px; }
  .go-btn{ width:100%; margin-top:6px; padding:14px; border:none; border-radius:6px; background:var(--mustard); color:var(--ink); font-weight:900; font-size:15.5px; letter-spacing:.04em; cursor:pointer; box-shadow:0 6px 14px rgba(217,164,65,0.35); }
  .go-btn:active{ transform:translateY(1px); }

  #results{ margin:0 14px; }
  .group-title{ font-size:13.5px; font-weight:900; color:var(--ink); margin:22px 2px 12px; padding-bottom:6px; border-bottom:2px solid var(--ink); }
  .group-title.secondary{ color:var(--ink-soft); border-bottom:1.5px dashed var(--line); }
  .result-meta{ font-size:12px; color:var(--ink-soft); margin:4px 2px 6px; font-weight:700; }
  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:30px 10px; border:1.5px dashed var(--line); border-radius:8px; background:var(--card); }

  .post{ position:relative; background:var(--card); border:1.5px solid var(--ink); border-radius:4px 14px 4px 4px; margin-bottom:16px; padding:16px 16px 14px 16px; box-shadow:3px 3px 0 var(--mustard); }
  .post.dim{ opacity:.72; box-shadow:3px 3px 0 var(--line); }
  .post:nth-child(even){ box-shadow:3px 3px 0 var(--sky); }
  .post.dim:nth-child(even){ box-shadow:3px 3px 0 var(--line); }
  .post-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .post-name{ font-size:17px; font-weight:700; font-family:'Shippori Mincho',serif; line-height:1.4; }
  .post-area{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .post-time{ flex-shrink:0; text-align:center; background:var(--ink); color:var(--paper); border-radius:4px; padding:6px 10px; min-width:62px; }
  .post-time .n{ font-size:16px; font-weight:900; font-family:'Shippori Mincho',serif; }
  .post-time .u{ font-size:9px; letter-spacing:.02em; }
  .post-desc{ font-size:13px; line-height:1.7; color:var(--ink); margin:10px 0 10px; }
  .post-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tag{ font-size:11px; padding:3px 9px; border-radius:100px; font-weight:700; background:var(--paper-deep); color:var(--ink-soft); border:1px solid var(--line); }
  .tag.reason{ background:var(--mustard); color:var(--ink); border-color:transparent; }
  .post-link{ display:inline-block; font-size:12.5px; font-weight:700; color:var(--sky); text-decoration:none; border-bottom:1.5px solid var(--sky); }
  footer{ margin:30px 14px 10px; text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:.7; }
</style>
</head>
<body>

<header class="board">
  <div class="eyebrow">Today's Day Trip Board</div>
  <h1>今日のおでかけ</h1>
  <div class="sub">出発地・気分・かけられる時間から、今日ちょうどいい場所を選びます。</div>

  <div class="origin-block">
    <div class="origin-label">出発地</div>
    <div class="origin-current" id="originCurrent">青葉台駅 発</div>
  </div>

</header>

<div class="filters">
  <div class="filter-block">
    <div class="filter-label">移動手段</div>
    <div class="chip-row" id="transportRow">
      <button type="button" class="chip active" data-transport="train">電車</button>
      <button type="button" class="chip" data-transport="car">車</button>
    </div>
  </div>
  <div class="filter-block">
    <div class="filter-label">かけられる時間（複数選択できます）</div>
    <div class="chip-row" id="timeRow">
      <button type="button" class="chip small active" data-bucket="0">〜30分</button>
      <button type="button" class="chip small active" data-bucket="1">30分〜1時間</button>
      <button type="button" class="chip small" data-bucket="2">1〜2時間</button>
      <button type="button" class="chip small" data-bucket="3">2時間以上</button>
    </div>
  </div>
  <div class="filter-block">
    <div class="filter-label">気分・したいこと（複数選択できます）</div>
    <div class="chip-row" id="moodRow">
      <button type="button" class="chip" data-mood="nature">自然・絶景</button>
      <button type="button" class="chip" data-mood="walk">散歩・散策</button>
      <button type="button" class="chip" data-mood="hike">軽登山・ハイク</button>
      <button type="button" class="chip" data-mood="onsen">温泉・湯</button>
      <button type="button" class="chip" data-mood="food">食べ歩き・グルメ</button>
      <button type="button" class="chip" data-mood="street">街歩き</button>
      <button type="button" class="chip" data-mood="garden">庭園・花</button>
    </div>
  </div>
  <button type="button" class="go-btn" id="goBtn">きょうのおすすめを見る</button>
</div>

<div id="results"></div>

<footer>所要時間は出発地からの直線距離をもとにした目安です。交通状況・乗換により前後します。</footer>

const SEASON_LABEL = {spring:"春", summer:"夏", autumn:"秋", winter:"冬"};
const CAT_LABEL = {nature:"自然・絶景", walk:"散歩・散策", hike:"軽登山・ハイク", onsen:"温泉・湯", food:"食べ歩き・グルメ", street:"街歩き", garden:"庭園・花"};
const BUCKETS = [ {min:0,max:30}, {min:30,max:60}, {min:60,max:120}, {min:120,max:99999} ];

function getSeason(month){
  if(month>=3 && month<=5) return "spring";
  if(month>=6 && month<=8) return "summer";
  if(month>=9 && month<=11) return "autumn";
  return "winter";
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function estimateMinutes(spot, mode){
  const base = mode === "train" ? spot.train : spot.car;
  if(base === null || base === undefined) return null;
  const distOrigin = haversine(origin.lat, origin.lon, spot.lat, spot.lon);
  const distDefault = haversine(DEFAULT_ORIGIN.lat, DEFAULT_ORIGIN.lon, spot.lat, spot.lon);
  if(distDefault < 1) return base;
  const speedFactor = base / distDefault;
  return Math.max(10, Math.round(distOrigin * speedFactor));
}

let state = { transport:"train", buckets:[0,1], moods:new Set() };

document.getElementById("transportRow").addEventListener("click", e=>{
  if(e.target.dataset.transport){ state.transport = e.target.dataset.transport; setActive("transportRow", e.target); render(); }
});
document.getElementById("timeRow").addEventListener("click", e=>{
  const btn = e.target.closest(".chip"); if(!btn) return;
  const idx = parseInt(btn.dataset.bucket);
  btn.classList.toggle("active");
  if(btn.classList.contains("active")) state.buckets.push(idx); else state.buckets = state.buckets.filter(b=>b!==idx);
  render();
});
document.querySelectorAll("#moodRow .chip").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const m = btn.dataset.mood;
    if(state.moods.has(m)){ state.moods.delete(m); btn.classList.remove("active"); }
    else { state.moods.add(m); btn.classList.add("active"); }
    render();
  });
});
function setActive(rowId, el){
  document.getElementById(rowId).querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
}
document.getElementById("goBtn").addEventListener("click", render);

function noteTags(s){
  const notes = [];
  if(s.rainOk) notes.push("☔雨の日もおすすめ");
  if(s.hot) notes.push("🌡️暑い日でも涼しい");
  if(s.cold && s.cat.includes("onsen")) notes.push("❄️寒い日にあたたまれる");
  return notes;
}
function postHtml(s){
  const tagsHtml = s.cat.map(c=>`<span class="tag">${CAT_LABEL[c]}</span>`).join("");
  const noteHtml = noteTags(s).map(n=>`<span class="tag reason">${n}</span>`).join("");
  const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.maps);
  return `
    <div class="post">
      <div class="post-top">
        <div><div class="post-name">${s.name}</div><div class="post-area">${s.area}</div></div>
        <div class="post-time"><div class="n">${s.t}</div><div class="u">分・約${s.km}km</div></div>
      </div>
      <div class="post-desc">${s.desc}</div>
      <div class="post-tags">${noteHtml}${tagsHtml}</div>
      <a class="post-link" href="${mapsUrl}" target="_blank" rel="noopener">地図で見る →</a>
    </div>`;
}
function render(){
  const results = document.getElementById("results");

  let candidates = SPOTS.map(s=>{
    const t = estimateMinutes(s, state.transport);
    const km = Math.round(haversine(origin.lat, origin.lon, s.lat, s.lon));
    return {...s, t, km};
  }).filter(s=>{
    if(s.t === null) return false;
    if(state.buckets.length > 0){
      const inBucket = state.buckets.some(bi => s.t >= BUCKETS[bi].min && s.t < BUCKETS[bi].max);
      if(!inBucket) return false;
    }
    if(state.moods.size > 0 && ![...state.moods].every(m=>s.cat.includes(m))) return false;
    return true;
  });

  if(candidates.length === 0){
    results.innerHTML = `<div class="empty-note">条件に合うスポットが見つかりませんでした。時間帯や気分の条件を見直してみてください。</div>`;
    return;
  }
  candidates.sort((a,b)=> a.t - b.t);

  let html = `<div class="result-meta">${candidates.length}件が条件に合っています（所要時間は直線距離からの目安です）</div>`;
  candidates.forEach(s=>{ html += postHtml(s); });
  results.innerHTML = html;
}

render();
</script>
