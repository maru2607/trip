<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日のおでかけ">
<meta name="theme-color" content="#1F3B2C">
<title>今日のおでかけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3B2C;
    --ink-soft:#3D5A4B;
    --paper:#EEF0E5;
    --paper-deep:#E4E7D7;
    --card:#FBFAF3;
    --mustard:#D9A441;
    --mustard-deep:#B9822B;
    --sky:#4C7A96;
    --brick:#8C3B2E;
    --line: rgba(31,59,42,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(76,122,150,0.08), transparent 55%),
      repeating-radial-gradient(circle at 20% 10%, transparent 0, transparent 38px, var(--line) 39px, transparent 40px),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,.mincho{font-family:'Shippori Mincho', serif;}

  header.board{
    margin:18px 14px 20px;
    padding:22px 20px 20px;
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    position:relative;
    box-shadow:0 10px 22px rgba(31,59,42,0.25);
    border:1px solid rgba(255,255,255,0.06);
  }
  header.board::before{
    content:"";
    position:absolute; left:50%; top:-12px; transform:translateX(-50%);
    width:6px; height:26px; background:#8a7350; border-radius:2px;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.24em; color:var(--mustard);
    text-transform:uppercase; margin-bottom:6px; font-weight:700;
  }
  header.board h1{
    font-size:24px; line-height:1.4; margin:0 0 4px; font-weight:700;
  }
  header.board .sub{
    font-size:12.5px; color:rgba(238,240,229,0.72); margin-bottom:16px;
  }
  .weather-strip{
    display:flex; align-items:center; gap:14px;
    border-top:1px dashed rgba(238,240,229,0.28);
    padding-top:14px; margin-top:4px;
  }
  .w-icon{font-size:34px; line-height:1;}
  .w-main{flex:1;}
  .w-temp{font-size:26px; font-weight:700; font-family:'Shippori Mincho',serif;}
  .w-desc{font-size:12px; color:rgba(238,240,229,0.75); margin-top:2px;}
  .w-season{
    font-size:11px; background:var(--mustard); color:var(--ink);
    padding:3px 10px; border-radius:100px; font-weight:700; white-space:nowrap;
  }
  .w-loading{font-size:13px; color:rgba(238,240,229,0.7);}
  .w-note{font-size:10.5px; color:rgba(238,240,229,0.55); margin-top:8px;}

  .mode-toggle{display:flex; gap:6px; margin-top:12px;}
  .mode-btn{
    flex:1; padding:7px; border-radius:5px; border:1px solid rgba(238,240,229,0.35);
    background:transparent; color:rgba(238,240,229,0.8); font-family:inherit;
    font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .mode-btn.active{background:var(--mustard); color:var(--ink); border-color:var(--mustard);}

  .manual-panel{margin-top:12px; display:none;}
  .manual-panel.show{display:block;}
  .manual-row{display:flex; gap:8px; margin-bottom:8px;}
  .manual-field{flex:1;}
  .manual-field label{font-size:10.5px; color:rgba(238,240,229,0.7); display:block; margin-bottom:4px;}
  .manual-field input, .manual-field select{
    width:100%; padding:8px; border-radius:5px; border:1px solid rgba(238,240,229,0.3);
    background:rgba(238,240,229,0.08); color:var(--paper); font-family:inherit; font-size:13px;
  }
  .manual-field select option{color:#111;}

  .filters{margin:0 14px 18px;}
  .filter-block{margin-bottom:14px;}
  .filter-label{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft);
    font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .filter-label::before{content:"◆"; color:var(--mustard-deep); font-size:9px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    appearance:none; border:1.5px solid var(--ink); background:var(--card);
    color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:700;
    padding:9px 16px; border-radius:100px; cursor:pointer;
    transition:transform .12s ease;
  }
  .chip:active{transform:scale(0.96);}
  .chip.active{background:var(--ink); color:var(--paper);}
  .go-btn{
    width:100%; margin-top:6px; padding:14px; border:none; border-radius:6px;
    background:var(--mustard); color:var(--ink); font-weight:900; font-size:15.5px;
    letter-spacing:.04em; cursor:pointer; box-shadow:0 6px 14px rgba(217,164,65,0.35);
  }
  .go-btn:active{transform:translateY(1px);}

  #results{margin:0 14px;}
  .group-title{
    font-size:13.5px; font-weight:900; color:var(--ink);
    margin:22px 2px 12px; padding-bottom:6px; border-bottom:2px solid var(--ink);
  }
  .group-title.secondary{color:var(--ink-soft); border-bottom:1.5px dashed var(--line);}
  .result-meta{
    font-size:12px; color:var(--ink-soft); margin:4px 2px 6px; font-weight:700;
  }
  .empty-note{
    font-size:13px; color:var(--ink-soft); text-align:center; padding:30px 10px;
    border:1.5px dashed var(--line); border-radius:8px; background:var(--card);
  }

  .post{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:4px 14px 4px 4px;
    margin-bottom:16px;
    padding:16px 16px 14px 16px;
    box-shadow:3px 3px 0 var(--mustard);
  }
  .post.dim{opacity:.72; box-shadow:3px 3px 0 var(--line);}
  .post:nth-child(even){box-shadow:3px 3px 0 var(--sky);}
  .post.dim:nth-child(even){box-shadow:3px 3px 0 var(--line);}
  .post-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .post-name{font-size:17px; font-weight:700; font-family:'Shippori Mincho',serif; line-height:1.4;}
  .post-area{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .post-time{
    flex-shrink:0; text-align:center; background:var(--ink); color:var(--paper);
    border-radius:4px; padding:6px 10px; min-width:54px;
  }
  .post-time .n{font-size:16px; font-weight:900; font-family:'Shippori Mincho',serif;}
  .post-time .u{font-size:9px; letter-spacing:.06em;}
  .post-desc{font-size:13px; line-height:1.7; color:var(--ink); margin:10px 0 10px;}
  .post-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .tag{
    font-size:11px; padding:3px 9px; border-radius:100px; font-weight:700;
    background:var(--paper-deep); color:var(--ink-soft); border:1px solid var(--line);
  }
  .tag.reason{background:var(--mustard); color:var(--ink); border-color:transparent;}
  .post-link{
    display:inline-block; font-size:12.5px; font-weight:700; color:var(--sky);
    text-decoration:none; border-bottom:1.5px solid var(--sky);
  }

  footer{
    margin:30px 14px 10px; text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:.7;
  }
</style>
</head>
<body>

<header class="board">
  <div class="eyebrow">Aobadai, Yokohama — Day Trip Board</div>
  <h1>今日のおでかけ</h1>
  <div class="sub">青葉台駅発、きょうの気候にあう日帰り先を案内します</div>
  <div class="weather-strip" id="weatherStrip">
    <div class="w-loading">現在の天気を取得中…</div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="autoModeBtn">自動取得</button>
    <button class="mode-btn" id="manualModeBtn">手動入力</button>
  </div>
  <div class="manual-panel" id="manualPanel">
    <div class="manual-row">
      <div class="manual-field">
        <label>気温（℃）</label>
        <input type="number" id="manualTemp" value="20">
      </div>
      <div class="manual-field">
        <label>天気</label>
        <select id="manualWeather">
          <option value="sunny">晴れ</option>
          <option value="cloudy">曇り</option>
          <option value="rain">雨</option>
          <option value="snow">雪</option>
        </select>
      </div>
    </div>
    <div class="w-note">日付は端末の今日の日付から季節を自動判定します。</div>
  </div>
</header>

<div class="filters">
  <div class="filter-block">
    <div class="filter-label">移動手段</div>
    <div class="chip-row" id="transportRow">
      <button class="chip active" data-transport="train">電車</button>
      <button class="chip" data-transport="car">車</button>
    </div>
  </div>
  <div class="filter-block">
    <div class="filter-label">片道の所要時間</div>
    <div class="chip-row" id="timeRow">
      <button class="chip" data-time="30">30分以内</button>
      <button class="chip active" data-time="60">1時間以内</button>
      <button class="chip" data-time="120">2時間以内</button>
      <button class="chip" data-time="180">3時間以内</button>
      <button class="chip" data-time="240">4時間以内</button>
    </div>
  </div>
  <div class="filter-block">
    <div class="filter-label">気分</div>
    <div class="chip-row" id="moodRow">
      <button class="chip active" data-mood="all">おまかせ</button>
      <button class="chip" data-mood="walk">散歩・散策</button>
      <button class="chip" data-mood="hike">山・軽登山</button>
      <button class="chip" data-mood="food">食べ歩き</button>
      <button class="chip" data-mood="onsen">温泉・スパ</button>
      <button class="chip" data-mood="kanko">観光地</button>
    </div>
  </div>
  <button class="go-btn" id="goBtn">きょうのおすすめを見る</button>
</div>

<div id="results"></div>

<footer>所要時間は青葉台駅発の目安です。交通状況・乗換により前後します。</footer>

  73:{label:"雪", icon:"🌨️", cat:"snow"},

  80:{label:"にわか雨", icon:"🌦️", cat:"rain"},
  81:{label:"にわか雨", icon:"🌦️", cat:"rain"},
  82:{label:"激しいにわか雨", icon:"🌧️", cat:"rain"},
  95:{label:"雷雨", icon:"⛈️", cat:"rain"},
};
const MANUAL_ICON = {sunny:"☀️", cloudy:"☁️", rain:"🌧️", snow:"❄️"};
const MANUAL_LABEL = {sunny:"晴れ", cloudy:"曇り", rain:"雨", snow:"雪"};

const SEASON_LABEL = {spring:"春", summer:"夏", autumn:"秋", winter:"冬"};
const CAT_LABEL = {walk:"散歩・散策", hike:"山・軽登山", food:"食べ歩き", onsen:"温泉・スパ", kanko:"観光地"};

function getSeason(month){
  if(month>=3 && month<=5) return "spring";
  if(month>=6 && month<=8) return "summer";
  if(month>=9 && month<=11) return "autumn";
  return "winter";
}

let state = { transport:"train", time:60, mood:"all", mode:"auto" };
let weatherData = null;

document.getElementById("transportRow").addEventListener("click", e=>{
  if(e.target.dataset.transport){ state.transport = e.target.dataset.transport; setActive("transportRow", e.target); render(); }
});
document.getElementById("timeRow").addEventListener("click", e=>{
  if(e.target.dataset.time){ state.time = parseInt(e.target.dataset.time); setActive("timeRow", e.target); render(); }
});
document.getElementById("moodRow").addEventListener("click", e=>{
  if(e.target.dataset.mood){ state.mood = e.target.dataset.mood; setActive("moodRow", e.target); render(); }
});
function setActive(rowId, el){
  document.getElementById(rowId).querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
}

document.getElementById("goBtn").addEventListener("click", render);

document.getElementById("autoModeBtn").addEventListener("click", ()=>{
  state.mode = "auto";
  document.getElementById("autoModeBtn").classList.add("active");
  document.getElementById("manualModeBtn").classList.remove("active");
  document.getElementById("manualPanel").classList.remove("show");
  loadWeather();
});
document.getElementById("manualModeBtn").addEventListener("click", ()=>{
  state.mode = "manual";
  document.getElementById("manualModeBtn").classList.add("active");
  document.getElementById("autoModeBtn").classList.remove("active");
  document.getElementById("manualPanel").classList.add("show");
  applyManualWeather();
});
document.getElementById("manualTemp").addEventListener("input", applyManualWeather);
document.getElementById("manualWeather").addEventListener("change", applyManualWeather);

function applyManualWeather(){
  const temp = parseFloat(document.getElementById("manualTemp").value) || 0;
  const cat = document.getElementById("manualWeather").value;
  const month = new Date().getMonth()+1;
  const season = getSeason(month);
  weatherData = {temp: Math.round(temp), cat, label:MANUAL_LABEL[cat], icon:MANUAL_ICON[cat], season};
  renderWeatherStrip();
  render();
}

async function loadWeather(){
  document.getElementById("weatherStrip").innerHTML = `<div class="w-loading">現在の天気を取得中…</div>`;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("network");
    const data = await res.json();
    const code = data.current.weather_code;
    const temp = Math.round(data.current.temperature_2m);
    const info = WEATHER_MAP[code] || {label:"—", icon:"🌡️", cat:"cloudy"};
    const month = new Date().getMonth()+1;
    const season = getSeason(month);
    weatherData = {temp, code, cat:info.cat, label:info.label, icon:info.icon, season};
    renderWeatherStrip();
    render();
  }catch(err){
    document.getElementById("weatherStrip").innerHTML =
      `<div class="w-loading">天気を自動取得できませんでした。「手動入力」に切り替えてください。</div>`;
    state.mode = "manual";
    document.getElementById("manualModeBtn").classList.add("active");
    document.getElementById("autoModeBtn").classList.remove("active");
    document.getElementById("manualPanel").classList.add("show");
    applyManualWeather();
  }
}

function renderWeatherStrip(){
  const w = weatherData;
  document.getElementById("weatherStrip").innerHTML = `
    <div class="w-icon">${w.icon}</div>
    <div class="w-main">
      <div class="w-temp">${w.temp}℃</div>
      <div class="w-desc">青葉台付近・${w.label}</div>
    </div>
    <div class="w-season">${SEASON_LABEL[w.season]}シーズン</div>
  `;
}

function scoreSpot(s, w){
  let score = 0;
  const reasons = [];
  if(s.season.includes(w.season)){ score += 3; reasons.push(SEASON_LABEL[w.season]+"におすすめ"); }
  if(s.weather.includes(w.cat)){ score += 3; reasons.push("今の天気にぴったり"); }
  if((w.cat === "rain" || w.cat === "snow") && s.rainOk){ score += 3; reasons.push("雨・雪の日でも楽しめる"); }
  if(w.temp <= 8 && (s.cat.includes("onsen") || s.cold)){ score += 3; reasons.push("寒い日はあったまれる"); }
  if(w.temp >= 29 && s.hot){ score += 4; reasons.push("暑い日でも涼しく過ごせる"); }
  return {score, reasons};
}

function groupCandidates(candidates, w){
  let groupA, groupB, titleA, titleB;
  if(w.temp >= 29){
    groupA = candidates.filter(c=>c.hot);
    groupB = candidates.filter(c=>!c.hot);
    titleA = `暑い日でも涼しく過ごせるスポット（現在${w.temp}℃）`;
    titleB = "そのほかの候補（日なたが多め）";
  } else if(w.cat === "rain" || w.cat === "snow"){
    groupA = candidates.filter(c=>c.rainOk);
    groupB = candidates.filter(c=>!c.rainOk);
    titleA = w.cat === "snow" ? "雪の日でも楽しめるスポット" : "雨の日でも楽しめるスポット";
    titleB = "晴れたら行きたい候補（今日はおすすめ度低め）";
  } else if(w.temp <= 8){
    groupA = candidates.filter(c=>c.cat.includes("onsen") || c.cold);
    groupB = candidates.filter(c=>!(c.cat.includes("onsen") || c.cold));
    titleA = `寒い日はあったまりたいスポット（現在${w.temp}℃）`;
    titleB = "そのほかの候補";
  } else {
    groupA = candidates.filter(c=>c.score >= 3);
    groupB = candidates.filter(c=>c.score < 3);
    titleA = `${SEASON_LABEL[w.season]}・${w.label}の日におすすめ`;
    titleB = "そのほかの候補";
  }
  const sortFn = (a,b)=> b.score - a.score || a.t - b.t;
  groupA.sort(sortFn);
  groupB.sort(sortFn);
  return [{title:titleA, items:groupA, primary:true}, {title:titleB, items:groupB, primary:false}];
}

function postHtml(s, primary){
  const tagsHtml = s.cat.map(c=>`<span class="tag">${CAT_LABEL[c]}</span>`).join("");
  const reasonHtml = s.reasons.slice(0,2).map(r=>`<span class="tag reason">${r}</span>`).join("");
  const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.maps);
  return `
    <div class="post${primary ? "" : " dim"}">
      <div class="post-top">
        <div>
          <div class="post-name">${s.name}</div>
          <div class="post-area">${s.area}</div>
        </div>
        <div class="post-time"><div class="n">${s.t}</div><div class="u">分</div></div>
      </div>
      <div class="post-desc">${s.desc}</div>
      <div class="post-tags">${reasonHtml}${tagsHtml}</div>
      <a class="post-link" href="${mapsUrl}" target="_blank" rel="noopener">地図で見る →</a>
    </div>
  `;
}

function render(){
  const results = document.getElementById("results");
  if(!weatherData){
    results.innerHTML = `<div class="empty-note">天気の情報を設定してください。</div>`;
    return;
  }
  const w = weatherData;

  let candidates = SPOTS.filter(s=>{
    const t = state.transport === "train" ? s.train : s.car;
    if(t === null || t === undefined) return false;
    if(t > state.time) return false;
    if(state.mood !== "all" && !s.cat.includes(state.mood)) return false;
    return true;
  });

  candidates = candidates.map(s=>{
    const {score, reasons} = scoreSpot(s, w);
    const t = state.transport === "train" ? s.train : s.car;
    return {...s, score, reasons, t};
  });

  if(candidates.length === 0){
    results.innerHTML = `<div class="empty-note">条件に合うスポットが見つかりませんでした。時間の範囲を広げてみてください。</div>`;
    return;
  }

  const transportLabel = state.transport === "train" ? "電車" : "車";
  const groups = groupCandidates(candidates, w);

  let html = `<div class="result-meta">${transportLabel}・${state.time}分以内 / 全${candidates.length}件</div>`;
  groups.forEach(g=>{
    if(g.items.length === 0) return;
    html += `<div class="group-title${g.primary ? "" : " secondary"}">${g.title}（${g.items.length}件）</div>`;
    g.items.forEach(s=>{ html += postHtml(s, g.primary); });
  });

  results.innerHTML = html;
}

loadWeather();
</script>
